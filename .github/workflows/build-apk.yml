name: Build Android APK
# Rebuild final APK with Bible-location persistence fix
# Trigger final build for the corrected Bible-location persistence patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'bible-resume-android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f bible-resume-android-project.zip
          mkdir -p project
          unzip -q bible-resume-android-project.zip -d project
          find project -type f | sort
          SETTINGS_FILE="$(find project -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find project -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found in ZIP."
            exit 1
          fi
          echo "BUILD_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Inspect app window and navigation layout
        shell: bash
        run: |
          set -euo pipefail
          echo '===== MainActivity.kt ====='
          sed -n '1,240p' "$BUILD_DIR/app/src/main/java/kr/co/srapp/bibleresume/MainActivity.kt"
          echo '===== Manifest ====='
          sed -n '1,220p' "$BUILD_DIR/app/src/main/AndroidManifest.xml"
          echo '===== Layout and web assets ====='
          find "$BUILD_DIR/app/src/main" -type f | sort
          find "$BUILD_DIR/app/src/main" -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.xml' \) -print

      - name: Fix system navigation overlap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/bible-resume-android/app/src/main/java/kr/co/srapp/bibleresume/MainActivity.kt')
          if not p.exists():
              candidates = list(Path('project').glob('**/MainActivity.kt'))
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one MainActivity.kt, found {len(candidates)}')
              p = candidates[0]
          source = p.read_text()
          # Accept every Bible route shape, not only numeric book/chapter segments.
          old_route_match = r"function isBiblePath(path) { return /^\/bible\/\d+\/\d+/.test(path || ''); }"
          broad_route_match = r"function isBiblePath(path) { return /^\/bible(?:\/|$)/i.test(path || ''); }"
          if old_route_match in source:
              source = source.replace(old_route_match, broad_route_match, 1)
          elif broad_route_match not in source:
              raise SystemExit('Could not locate Bible route matcher; refusing unsafe patch.')
          # Distinguish the Bible table-of-contents route (/bible) from an actual reading
          # position (/bible/{book}/{chapter}). Only reading routes may overwrite the saved position.
          reading_match = "function isBiblePath(path) { return /^\\/bible(?:\\/|$)/i.test(path || ''); }"
          reading_helpers = reading_match + "\n          function isBibleReadingPath(path) { return /^\\/bible\\/\\d+\\/\\d+(?:\\/|$)/i.test(path || ''); }"
          if "function isBibleReadingPath(path)" not in source:
              if reading_match not in source:
                  raise SystemExit('Could not locate broad Bible route matcher for reading-position patch.')
              source = source.replace(reading_match, reading_helpers, 1)
          source = source.replace("if (isBiblePath(location.pathname)) {", "if (isBibleReadingPath(location.pathname)) {", 1)
          source = source.replace("return isBiblePath(p) ? p : null;", "return isBibleReadingPath(p) ? p : null;", 1)
          source = source.replace("if (label.indexOf('성경') === -1 || isBiblePath(location.pathname)) return;", "if (label.indexOf('성경') === -1 || isBibleReadingPath(location.pathname)) return;", 1)
          source = source.replace(
              "          window.addEventListener('popstate', saveCurrent);\n",
              "          window.addEventListener('popstate', saveCurrent);\n"
              "          window.addEventListener('hashchange', saveCurrent);\n"
              "          window.addEventListener('pagehide', saveCurrent);\n"
              "          document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'hidden') saveCurrent(); });\n",
              1
          )
          source = source.replace(
              'import android.os.Bundle\n',
              'import android.os.Bundle\nimport android.os.Build\nimport android.view.WindowInsets\nimport android.widget.FrameLayout\n',
              1
          ) if 'import android.widget.FrameLayout' not in source else source
          source = source.replace(
              '        window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)\n',
              '        window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)\n'
              '        window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)\n'
              '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n'
              '            window.setDecorFitsSystemWindows(false)\n'
              '        }\n',
              1
          )
          old_listener = '''        webView.setOnApplyWindowInsetsListener { view, insets ->
                      view.setPadding(insets.systemWindowInsetLeft, insets.systemWindowInsetTop, insets.systemWindowInsetRight, insets.systemWindowInsetBottom)
                      insets
                  }
          '''
          source = source.replace(old_listener, '')
          # Route the worship tab to the user's YouTube playlist from inside the existing WebView.
          marker = "if (label.indexOf('성경') === -1 || isBibleReadingPath(location.pathname)) return;"
          worship_route = """if (label.indexOf('예배') !== -1) {
                      event.preventDefault();
                      event.stopPropagation();
                      if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                      location.href = 'https://youtube.com/playlist?list=PLCNxYye_JJpZXsl4cQEjzBWRUFSCb2MCE';
                      return;
                    }
                    """
          if marker in source and worship_route.strip() not in source:
              source = source.replace(marker, worship_route + marker, 1)
          elif marker not in source:
              raise SystemExit('Could not locate Bible-tab click handler marker; refusing unsafe patch.')
          old_content = '        setContentView(webView)\n'
          new_content = '''        val root = FrameLayout(this)
                  root.setOnApplyWindowInsetsListener { view, insets ->
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          val bars = insets.getInsets(WindowInsets.Type.systemBars())
                          view.setPadding(bars.left, bars.top, bars.right, bars.bottom)
                      } else {
                          @Suppress("DEPRECATION")
                          view.setPadding(insets.systemWindowInsetLeft, insets.systemWindowInsetTop, insets.systemWindowInsetRight, insets.systemWindowInsetBottom)
                      }
                      insets
                  }
                  root.addView(webView, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ))
                  setContentView(root)
          '''
          if old_content in source and 'root.setOnApplyWindowInsetsListener' not in source:
              source = source.replace(old_content, new_content, 1)
          elif 'root.setOnApplyWindowInsetsListener' not in source:
              raise SystemExit('Could not locate setContentView(webView); refusing unsafe patch.')
          p.write_text(source)
          print(f'Applied root-container system-bar inset fix to {p}')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bible-resume-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# Fix Bible index route so returning to the Bible tab restores the last book/chapter.
