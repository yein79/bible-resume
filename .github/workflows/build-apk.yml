name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'bible-resume-android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f bible-resume-android-project.zip
          mkdir -p project
          unzip -q bible-resume-android-project.zip -d project
          find project -type f | sort
          BUILD_FILE="$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No Gradle build file found in ZIP."
            exit 1
          fi
          echo "BUILD_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bible-resume-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
