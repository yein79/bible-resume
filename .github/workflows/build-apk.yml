name: Build Android APK
# Rebuild final APK with Bible-location persistence fix
# Trigger final build for the corrected Bible-location persistence patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'bible-resume-android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f bible-resume-android-project.zip
          mkdir -p project
          unzip -q bible-resume-android-project.zip -d project
          find project -type f | sort
          SETTINGS_FILE="$(find project -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find project -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found in ZIP."
            exit 1
          fi
          echo "BUILD_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Inspect app window and navigation layout
        shell: bash
        run: |
          set -euo pipefail
          echo '===== MainActivity.kt ====='
          sed -n '1,240p' "$BUILD_DIR/app/src/main/java/kr/co/srapp/bibleresume/MainActivity.kt"
          echo '===== Manifest ====='
          sed -n '1,220p' "$BUILD_DIR/app/src/main/AndroidManifest.xml"
          echo '===== Layout and web assets ====='
          find "$BUILD_DIR/app/src/main" -type f | sort
          find "$BUILD_DIR/app/src/main" -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.xml' \) -print

      - name: Fix system navigation overlap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/bible-resume-android/app/src/main/java/kr/co/srapp/bibleresume/MainActivity.kt')
          if not p.exists():
              candidates = list(Path('project').glob('**/MainActivity.kt'))
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one MainActivity.kt, found {len(candidates)}')
              p = candidates[0]
          source = p.read_text()
          # Accept every Bible route shape, not only numeric book/chapter segments.
          old_route_match = r"function isBiblePath(path) { return /^\/bible\/\d+\/\d+/.test(path || ''); }"
          broad_route_match = r"function isBiblePath(path) { return /^\/bible(?:\/|$)/i.test(path || ''); }"
          if old_route_match in source:
              source = source.replace(old_route_match, broad_route_match, 1)
          elif broad_route_match not in source:
              raise SystemExit('Could not locate Bible route matcher; refusing unsafe patch.')
          # Distinguish the Bible table-of-contents route (/bible) from an actual reading
          # position (/bible/{book}/{chapter}). Only reading routes may overwrite the saved position.
          reading_match = "function isBiblePath(path) { return /^\\/bible(?:\\/|$)/i.test(path || ''); }"
          reading_helpers = reading_match + "\n          function isBibleReadingPath(path) { return /^\\/bible\\/\\d+\\/\\d+(?:\\/|$)/i.test(path || ''); }"
          if "function isBibleReadingPath(path)" not in source:
              if reading_match not in source:
                  raise SystemExit('Could not locate broad Bible route matcher for reading-position patch.')
              source = source.replace(reading_match, reading_helpers, 1)
          source = source.replace("if (isBiblePath(location.pathname)) {", "if (isBibleReadingPath(location.pathname)) {", 1)
          source = source.replace("return isBiblePath(p) ? p : null;", "return isBibleReadingPath(p) ? p : null;", 1)
          source = source.replace(
              "if (label.indexOf('성경') === -1 || isBiblePath(location.pathname)) return;",
              """if (label.indexOf('성경') === -1) return;
            if (isBibleReadingPath(location.pathname)) {
              saveCurrent();
              event.preventDefault();
              event.stopPropagation();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return;
            }""",
              1
          )
          source = source.replace(
              "          window.addEventListener('popstate', saveCurrent);\n",
              "          window.addEventListener('popstate', saveCurrent);\n"
              "          window.addEventListener('hashchange', saveCurrent);\n"
              "          window.addEventListener('pagehide', saveCurrent);\n"
              "          document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'hidden') saveCurrent(); });\n",
              1
          )
          source = source.replace(
              'import android.os.Bundle\n',
              'import android.os.Bundle\nimport android.os.Build\nimport android.view.WindowInsets\nimport android.widget.FrameLayout\n',
              1
          ) if 'import android.widget.FrameLayout' not in source else source
          source = source.replace(
              '        window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)\n',
              '        window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)\n'
              '        window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)\n'
              '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n'
              '            window.setDecorFitsSystemWindows(false)\n'
              '        }\n',
              1
          )
          old_listener = '''        webView.setOnApplyWindowInsetsListener { view, insets ->
                      view.setPadding(insets.systemWindowInsetLeft, insets.systemWindowInsetTop, insets.systemWindowInsetRight, insets.systemWindowInsetBottom)
                      insets
                  }
          '''
          source = source.replace(old_listener, '')
          # Route the worship tab to the user's YouTube playlist from inside the existing WebView.
          marker = "if (label.indexOf('성경') === -1) return;"
          worship_route = """if (label.indexOf('예배') !== -1) {
                      event.preventDefault();
                      event.stopPropagation();
                      if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                      location.href = 'https://youtube.com/playlist?list=PLCNxYye_JJpZXsl4cQEjzBWRUFSCb2MCE';
                      return;
                    }
                    """
          if marker in source and worship_route.strip() not in source:
              source = source.replace(marker, worship_route + marker, 1)
          elif marker not in source:
              raise SystemExit('Could not locate Bible-tab click handler marker; refusing unsafe patch.')
          # When the book drawer opens, scroll its list to the book in the current reading route.
          # This fixes the list's scroll position, not just the saved URL.
          scroll_marker = "          var previous = location.pathname + location.search;"
          scroll_code = r"""
          var bibleBookNames = [
            '창세기','출애굽기','레위기','민수기','신명기','여호수아','사사기','룻기',
            '사무엘상','사무엘하','열왕기상','열왕기하','역대상','역대하','에스라','느헤미야','에스더',
            '욥기','시편','잠언','전도서','아가','이사야','예레미야','예레미야애가','에스겔','다니엘',
            '호세아','요엘','아모스','오바댜','요나','미가','나훔','하박국','스바냐','학개','스가랴','말라기',
            '마태복음','마가복음','누가복음','요한복음','사도행전','로마서','고린도전서','고린도후서','갈라디아서',
            '에베소서','빌립보서','골로새서','데살로니가전서','데살로니가후서','디모데전서','디모데후서','디도서',
            '빌레몬서','히브리서','야고보서','베드로전서','베드로후서','요한일서','요한이서','요한삼서','유다서','요한계시록'
          ];
          var bibleLastReadingPath = '';
          try { bibleLastReadingPath = sessionStorage.getItem('bibleLastReadingPath') || ''; } catch (_) {}
          function bibleReadingPath(path) {
            return /^\/bible\/\d+(?:\/\d+)?(?:\/|$)/i.test(path || '');
          }
          function rememberBibleReadingPath() {
            if (bibleReadingPath(location.pathname)) {
              bibleLastReadingPath = location.pathname;
              try { sessionStorage.setItem('bibleLastReadingPath', bibleLastReadingPath); } catch (_) {}
            }
          }
          function bibleLabel(el) {
            return (el && (el.innerText || el.textContent) || '').replace(/[\s\u00a0]+/g, '').trim();
          }
          function bibleNodeVisible(el) {
            if (!el || !el.getClientRects || !el.getClientRects().length) return false;
            var s = window.getComputedStyle(el);
            return s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity || 1) > 0;
          }
          function bibleScrollableAncestor(el) {
            var p = el && el.parentElement;
            while (p && p !== document.body && p !== document.documentElement) {
              var ps = window.getComputedStyle(p);
              if (/(auto|scroll|overlay)/.test(ps.overflowY) && p.scrollHeight > p.clientHeight + 8) return p;
              p = p.parentElement;
            }
            return null;
          }
          function syncBibleBookListScroll() {
            rememberBibleReadingPath();
            var path = location.pathname;
            if (!bibleReadingPath(path)) {
              try {
                var saved = sessionStorage.getItem('bibleLastReadingPath') || bibleLastReadingPath;
                if (saved && bibleReadingPath(saved)) path = saved;
              } catch (_) {}
            }
            var m = path.match(/^\/bible\/(\d+)(?:\/(\d+))?(?:\/|$)/i);
            if (!m) return;
            var book = bibleBookNames[Number(m[1]) - 1];
            if (!book) return;
            var candidates = [];
            Array.prototype.forEach.call(document.querySelectorAll('body *'), function(el) {
              if (!bibleNodeVisible(el)) return;
              var label = bibleLabel(el);
              if (!label || label.length > 36 || (label !== book && label.indexOf(book) !== 0)) return;
              var rect = el.getBoundingClientRect();
              if (rect.width < 2 || rect.height < 2) return;
              candidates.push({
                el: el,
                exact: label === book,
                scrollBox: bibleScrollableAncestor(el),
                area: rect.width * rect.height
              });
            });
            if (!candidates.length) return;
            // Prefer the matching book entry inside the scrollable contents list,
            // rather than a page heading or a hidden duplicate elsewhere in the DOM.
            candidates.sort(function(a, b) {
              if (!!a.scrollBox !== !!b.scrollBox) return a.scrollBox ? -1 : 1;
              if (a.exact !== b.exact) return a.exact ? -1 : 1;
              return a.area - b.area;
            });
            var chosen = candidates[0], target = chosen.el, scrollBox = chosen.scrollBox;
            if (scrollBox) {
              var tr = target.getBoundingClientRect(), sr = scrollBox.getBoundingClientRect();
              // Align the selected book to the top of the contents viewport,
              // so Luke and other selected books are immediately visible at the top.
              scrollBox.scrollTop += tr.top - sr.top - 8;
            } else {
              try { target.scrollIntoView({block:'center', inline:'nearest', behavior:'auto'}); }
              catch (_) { target.scrollIntoView(); }
            }
          }
          function queueBibleListSync() {
            [0, 80, 220, 500].forEach(function(delay) {
              setTimeout(function() {
                rememberBibleReadingPath();
                syncBibleBookListScroll();
              }, delay);
            });
          }
          // Save the reading route before a click navigates from the reader to /bible (contents).
          document.addEventListener('click', function() {
            rememberBibleReadingPath();
            queueBibleListSync();
          }, true);
          window.addEventListener('popstate', queueBibleListSync);
          window.addEventListener('hashchange', queueBibleListSync);
          var bibleListObserver = new MutationObserver(function() {
            rememberBibleReadingPath();
            syncBibleBookListScroll();
          });
          bibleListObserver.observe(document.documentElement, {
            childList:true, subtree:true, attributes:true,
            attributeFilter:['class','style','aria-hidden','aria-selected']
          });
          queueBibleListSync();
          """
          if "function syncBibleBookListScroll()" not in source:
              if scroll_marker not in source:
                  raise SystemExit('Could not locate safe route-monitor insertion point.')
              source = source.replace(scroll_marker, scroll_code + scroll_marker, 1)
          old_content = '        setContentView(webView)\n'
          new_content = '''        val root = FrameLayout(this)
                  root.setOnApplyWindowInsetsListener { view, insets ->
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          val bars = insets.getInsets(WindowInsets.Type.systemBars())
                          view.setPadding(bars.left, bars.top, bars.right, bars.bottom)
                      } else {
                          @Suppress("DEPRECATION")
                          view.setPadding(insets.systemWindowInsetLeft, insets.systemWindowInsetTop, insets.systemWindowInsetRight, insets.systemWindowInsetBottom)
                      }
                      insets
                  }
                  root.addView(webView, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ))
                  setContentView(root)
          '''
          if old_content in source and 'root.setOnApplyWindowInsetsListener' not in source:
              source = source.replace(old_content, new_content, 1)
          elif 'root.setOnApplyWindowInsetsListener' not in source:
              raise SystemExit('Could not locate setContentView(webView); refusing unsafe patch.')
          p.write_text(source)
          print(f'Applied root-container system-bar inset fix to {p}')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bible-resume-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# Fix Bible index route so returning to the Bible tab restores the last book/chapter.
